components:
  schemas:
    ActionTypeEnum:
      enum:
      - create_alert
      - create_appointment
      - create_referral
      type: string
      description: |-
        * `create_alert` - Create Alert
        * `create_appointment` - Create Appointment
        * `create_referral` - Create Referral
    Admission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        bed:
          type: integer
          nullable: true
        bed_label:
          type: string
          readOnly: true
        admitted_by_username:
          type: string
          readOnly: true
        reason:
          type: string
          maxLength: 255
        diagnosis_on_admission:
          type: string
        status:
          $ref: '#/components/schemas/AdmissionStatusEnum'
        admitted_at:
          type: string
          format: date-time
          readOnly: true
        expected_discharge_date:
          type: string
          format: date
          nullable: true
        discharge_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        discharge_summary:
          type: string
      required:
      - admitted_at
      - admitted_by_username
      - bed_label
      - discharge_at
      - id
      - patient
      - patient_name
      - reason
    AdmissionDischargeRequest:
      type: object
      properties:
        discharge_summary:
          type: string
    AdmissionStatusEnum:
      enum:
      - admitted
      - discharged
      - transferred
      type: string
      description: |-
        * `admitted` - Admitted
        * `discharged` - Discharged
        * `transferred` - Transferred
    AlertSeverityEnum:
      enum:
      - medium
      - high
      - critical
      type: string
      description: |-
        * `medium` - Medium
        * `high` - High
        * `critical` - Critical
    AnalyticsKpi:
      type: object
      properties:
        patients_total:
          type: integer
        upcoming_appointments:
          type: integer
        assessments_last_30_days:
          type: integer
        open_alerts:
          type: integer
      required:
      - assessments_last_30_days
      - open_alerts
      - patients_total
      - upcoming_appointments
    AnalyticsOverview:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        kpis:
          $ref: '#/components/schemas/AnalyticsKpi'
        risk_distribution_last_30_days:
          type: object
          additionalProperties:
            type: integer
        top_diagnoses:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisBreakdown'
        assessment_trend:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentTrendPoint'
      required:
      - assessment_trend
      - generated_at
      - kpis
      - risk_distribution_last_30_days
      - top_diagnoses
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        clinician_name:
          type: string
          maxLength: 255
        reason:
          type: string
          maxLength: 255
        scheduled_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - clinician_name
      - created_at
      - id
      - patient
      - patient_name
      - scheduled_at
    AppointmentStatusEnum:
      enum:
      - scheduled
      - completed
      - cancelled
      - no_show
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `completed` - Completed
        * `cancelled` - Cancelled
        * `no_show` - No Show
    AssessmentTrendPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - date
    Bed:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ward:
          type: integer
        ward_code:
          type: string
          readOnly: true
        bed_number:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/BedStatusEnum'
        current_patient:
          type: integer
          nullable: true
        current_patient_name:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bed_number
      - current_patient_name
      - id
      - updated_at
      - ward
      - ward_code
    BedStatusEnum:
      enum:
      - available
      - occupied
      - cleaning
      - maintenance
      type: string
      description: |-
        * `available` - Available
        * `occupied` - Occupied
        * `cleaning` - Cleaning
        * `maintenance` - Maintenance
    CategoryEnum:
      enum:
      - mental_health
      - food_support
      - transport
      - financial
      - housing
      - chronic_care
      - wellness
      type: string
      description: |-
        * `mental_health` - Mental Health
        * `food_support` - Food Support
        * `transport` - Transport
        * `financial` - Financial Aid
        * `housing` - Housing
        * `chronic_care` - Chronic Care
        * `wellness` - Wellness
    CheckInResponse:
      type: object
      properties:
        checkin:
          $ref: '#/components/schemas/PatientCheckIn'
        alert_created:
          type: boolean
        alert_id:
          type: integer
          nullable: true
      required:
      - alert_created
      - alert_id
      - checkin
    ClinicalAlert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        patient_name:
          type: string
          readOnly: true
        assessment:
          type: integer
          nullable: true
        severity:
          $ref: '#/components/schemas/AlertSeverityEnum'
        title:
          type: string
          maxLength: 255
        message:
          type: string
        resolved:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - patient
      - patient_name
      - severity
      - title
    CommunityRecommendationResponse:
      type: object
      properties:
        patient_id:
          type: integer
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRecommendation'
        auto_referrals_created:
          type: array
          items:
            type: integer
      required:
      - auto_referrals_created
      - patient_id
      - recommendations
    CommunityResource:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/CategoryEnum'
        location:
          type: string
          maxLength: 255
        contact_phone:
          type: string
          maxLength: 30
        website:
          type: string
          format: uri
          maxLength: 200
        description:
          type: string
        eligibility:
          type: string
          maxLength: 255
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - id
      - name
    CurrentUserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        is_superuser:
          type: boolean
        roles:
          type: array
          items:
            type: string
      required:
      - id
      - is_superuser
      - roles
      - username
    DiagnosisBreakdown:
      type: object
      properties:
        diagnosis:
          type: string
        count:
          type: integer
      required:
      - count
      - diagnosis
    DomainEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        payload:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DomainEventStatusEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        error_message:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempts
      - error_message
      - event_type
      - id
      - occurred_at
      - payload
      - processed_at
      - source
      - status
    DomainEventStatusEnum:
      enum:
      - pending
      - processed
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processed` - Processed
        * `failed` - Failed
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
    HospitalFlowKpi:
      type: object
